# this_file: src_docs/mkdocs.yml
site_name: Plugmix for FontLab
site_description: App Extensions and the retained compatibility plugins.
site_url: https://fontlabcom.github.io/fontlab-python-plugmix/
repo_url: https://github.com/fontlabcom/fontlab-python-plugmix
repo_name: fontlabcom/fontlab-python-plugmix
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january
  language: en
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
  - fly
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Installation: installation.md
  - App Extensions: app-menu-scripts.md
  - Filters and tools:
      - Round Outline to Grid: plugins/round-outline-to-grid.md
      - Move Outlines: plugins/move-outlines.md
      - Scale Outlines: plugins/scale-outlines.md
      - Slant Outlines: plugins/slant-outlines.md
      - Measurement Ruler: plugins/measurement-ruler.md
      - Node Probe: plugins/node-probe.md
      - Contour Picker: plugins/contour-picker.md
  - Compatibility package: compatibility-package.md
  - Consumer audit: consumer-audit.md
  - Development and limits: development-and-limits.md
  - Licence: licence.md
extra:
  fly:
    chrome: fontlab
    chrome_options:
      site-label: Plugmix
extra_css:
  - stylesheets/local.css
hooks:
  - english_search.py
