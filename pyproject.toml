[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fontlab-python-plugmix"
dynamic = ["version"]
description = "Native FontLab 9 reporter and filter plugins"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["fontlab-fontlabapp>=1.2.10"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fontlab_plugmix"]

[tool.hatch.build.targets.sdist]
exclude = ["/.omc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-branch --cov-report=term-missing --cov-report=json:coverage.json"


[tool.fontlab-install]
id = "com.fontlab.python-plugmix"
name = "fontlab-python-plugmix"
packages = []  # Extensions bundles and Scripts only; the fontlab_plugmix package is a separate runtime
extensions = "Extensions"
dependencies = ["fontlab-fontlabapp>=1.2.10", "fontlab-fly>=1.3.0"]
